pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral { content { excludeGroupByRegex 'androidx\\..*'; excludeGroupByRegex 'com\\.android.*'; excludeGroupByRegex 'com\\.google\\.android.*' } }
        google()
    }
}
rootProject.name = 'NeonPlayer'
include ':app'
